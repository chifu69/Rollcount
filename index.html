<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#123b5d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Roll Count" />
  <title>Roll Count</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <div class="eyebrow">K1 OPERATIONS</div>
      <h1>Roll Count</h1>
      <p id="dateLabel"></p>
    </div>
    <button class="icon-btn" id="historyBtn" aria-label="History">History</button>
  </header>

  <main>
    <section class="status-card">
      <div><span>Roll types in stock</span><strong id="typesInStock">0</strong></div>
      <div><span>Total rolls</span><strong id="grandTotal">0</strong></div>
    </section>

    <section class="section-head">
      <div>
        <h2>Inventory Entry</h2>
        <p>Enter each count where you find the rolls. Totals update automatically.</p>
      </div>
    </section>

    <div id="rollList" class="roll-list"></div>

    <section class="report-card" id="reportSection">
      <div class="report-title-row">
        <div>
          <div class="eyebrow">EMAIL-READY REPORT</div>
          <h2>Inventory Summary</h2>
        </div>
        <span class="pill" id="reportCount">0 types</span>
      </div>
      <div id="summaryEmpty" class="empty-state">No rolls entered yet.</div>
      <div id="summaryList" class="summary-list"></div>
      <div class="report-total"><span>Total Rolls</span><strong id="reportTotal">0</strong></div>
      <div class="action-grid">
        <button class="btn primary" id="shareBtn">Share Report</button>
        <button class="btn" id="copyBtn">Copy</button>
        <button class="btn" id="printBtn">PDF / Print</button>
        <button class="btn danger" id="newDayBtn">New Day / Clear</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="historyDialog">
    <div class="dialog-head">
      <div><div class="eyebrow">SAVED COUNTS</div><h2>History</h2></div>
      <button class="icon-btn" id="closeHistory">Close</button>
    </div>
    <div id="historyList" class="history-list"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
